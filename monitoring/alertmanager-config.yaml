apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'slack-alerts'
    receivers:
    - name: 'slack-alerts'
      slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#all-devops-alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}FIRING: {{ .GroupLabels.alertname }}{{ else }}RESOLVED: {{ .GroupLabels.alertname }}{{ end }}'
        text: '{{ if eq .Status "firing" }}{{ range .Alerts }}{{ .Annotations.description }}{{ end }}{{ else }}devops-capstone app is back UP and running normally.{{ end }}' 
